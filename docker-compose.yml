version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bank-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bankdb
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    container_name: bank-management-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  bank-network:
    driver: bridge
